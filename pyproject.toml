[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipping-bill-agent"
version = "1.7.0"
description = "多格式文档解析的航运智能账单助手智能体（Python + LangChain）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "pydantic>=2.7",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0", "pillow>=10.0", "xlwt>=1.3"]

[project.scripts]
shipping-bill-agent = "shipping_bill_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 某些受管控环境会拦截系统临时目录创建，固定到项目内更稳
addopts = "-q --basetemp=.pytest_tmp"
